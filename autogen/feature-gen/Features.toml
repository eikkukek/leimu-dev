# vk_13
[vk_13]
doc = ["Core Vulkan 1.3 [`features`][Features]."]
version = "VULKAN_API_VERSION_1_3"
get_features = "get_features::<vk::PhysicalDeviceVulkan13Features>"
set_features = "set_features::<vk::PhysicalDeviceVulkan13Features, _>"
[[vk_13.features]]
doc = [
  "Adds support for [Robust Image Access] guarantees for shader image accesses.",
  "",
  "[Robust Image Access]: https://docs.vulkan.org/spec/latest/chapters/shaders.html#shaders-robust-image-access"
]
title = "robust_image_access"
extension.path = "tuhka::ext::image_robustness::NAME"
extension.features = "vk::PhysicalDeviceImageRobustnessFeatures"
[[vk_13.features]]
doc = [
  "Enables the use of inline uniform block descriptors.",
]
title = "inline_uniform_block"
extension.path = "tuhka::ext::inline_uniform_block::NAME"
extension.features = "vk::PhysicalDeviceInlineUniformBlockFeatures"
extension.vk_properties = "vk::PhysicalDeviceInlineUniformBlockProperties"
extension.property_fields = [
  "max_size: u32",
  "max_per_stage_blocks: u32",
  "max_descriptor_set_blocks: u32",
]
extension.property_docs = [
  # max_size
  "The maximum size in bytes of a single inline uniform block binding.",
  # max_per_stage_blocks
  "The maximum number of inline uniform blocks that **can** be accessible to a single\n",
  "shader stage.",
  # max_descriptor_set_blocks 
  "The maximum number of inline uniform block bindings that **can** be included in\n",
  "descriptor bindings across all shader stages and descriptor set numbers.",
]
extension.property_mappings = [
  "max_inline_uniform_block_size",
  "max_per_stage_descriptor_inline_uniform_blocks",
  "max_descriptor_set_inline_uniform_blocks",
]
